<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');

      .title {
        font-family: 'Inter', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        fill: #f0f6ff;
        letter-spacing: -2px;
      }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }

      .n-green { animation: pulseG 3s ease-in-out infinite; }
      .n-gray  { animation: pulseS 4s ease-in-out infinite; }

      .n1  { animation-delay: 0.0s; }
      .n2  { animation-delay: 0.3s; }
      .n3  { animation-delay: 0.6s; }
      .n4  { animation-delay: 0.9s; }
      .n5  { animation-delay: 1.2s; }
      .n6  { animation-delay: 1.5s; }
      .n7  { animation-delay: 1.8s; }
      .n8  { animation-delay: 2.1s; }
      .n9  { animation-delay: 2.4s; }
      .n10 { animation-delay: 0.5s; }
      .n11 { animation-delay: 0.8s; }
      .n12 { animation-delay: 1.1s; }
      .n13 { animation-delay: 1.4s; }
      .n14 { animation-delay: 1.7s; }
      .n15 { animation-delay: 2.0s; }

      @keyframes pulseG {
        0%, 100% { opacity: 0.3; r: 2; }
        50%       { opacity: 1.0; r: 3.2; }
      }
      @keyframes pulseS {
        0%, 100% { opacity: 0.12; }
        50%       { opacity: 0.35; }
      }

      .edge { animation: edgeFade 4s ease-in-out infinite; }
      .e1  { animation-delay: 0.2s; }
      .e2  { animation-delay: 0.7s; }
      .e3  { animation-delay: 1.2s; }
      .e4  { animation-delay: 1.7s; }
      .e5  { animation-delay: 2.2s; }
      .e6  { animation-delay: 2.7s; }
      .e7  { animation-delay: 0.4s; }
      .e8  { animation-delay: 0.9s; }
      .e9  { animation-delay: 1.4s; }
      .e10 { animation-delay: 1.9s; }

      @keyframes edgeFade {
        0%, 100% { opacity: 0.06; }
        50%       { opacity: 0.20; }
      }

      .fadein { animation: fadeIn 1.2s ease forwards; opacity: 0; }
      @keyframes fadeIn { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="#080c14"/>

  <!-- Edges -->
  <g stroke="#94a3b8" stroke-width="0.6" fill="none">
    <line class="edge e1"  x1="60"  y1="18"  x2="148" y2="55"/>
    <line class="edge e2"  x1="148" y1="55"  x2="265" y2="28"/>
    <line class="edge e3"  x1="265" y1="28"  x2="380" y2="62"/>
    <line class="edge e4"  x1="380" y1="62"  x2="490" y2="35"/>
    <line class="edge e5"  x1="490" y1="35"  x2="600" y2="58"/>
    <line class="edge e6"  x1="600" y1="58"  x2="720" y2="30"/>
    <line class="edge e7"  x1="720" y1="30"  x2="840" y2="52"/>
    <line class="edge e8"  x1="840" y1="52"  x2="960" y2="22"/>
    <line class="edge e9"  x1="960" y1="22"  x2="1070" y2="48"/>
    <line class="edge e10" x1="1070" y1="48" x2="1160" y2="20"/>

    <line class="edge e3"  x1="60"   y1="18"  x2="265"  y2="28"/>
    <line class="edge e5"  x1="148"  y1="55"  x2="380"  y2="62"/>
    <line class="edge e7"  x1="380"  y1="62"  x2="600"  y2="58"/>
    <line class="edge e9"  x1="600"  y1="58"  x2="840"  y2="52"/>
    <line class="edge e2"  x1="840"  y1="52"  x2="1070" y2="48"/>
    <line class="edge e4"  x1="265"  y1="28"  x2="490"  y2="35"/>
    <line class="edge e6"  x1="490"  y1="35"  x2="720"  y2="30"/>
    <line class="edge e8"  x1="720"  y1="30"  x2="960"  y2="22"/>
    <line class="edge e10" x1="960"  y1="22"  x2="1160" y2="20"/>

    <!-- bottom row edges -->
    <line class="edge e2"  x1="100"  y1="190" x2="220"  y2="175"/>
    <line class="edge e4"  x1="220"  y1="175" x2="360"  y2="195"/>
    <line class="edge e6"  x1="360"  y1="195" x2="500"  y2="178"/>
    <line class="edge e8"  x1="500"  y1="178" x2="650"  y2="192"/>
    <line class="edge e1"  x1="650"  y1="192" x2="800"  y2="180"/>
    <line class="edge e3"  x1="800"  y1="180" x2="940"  y2="196"/>
    <line class="edge e5"  x1="940"  y1="196" x2="1080" y2="182"/>
    <line class="edge e7"  x1="1080" y1="182" x2="1170" y2="198"/>

    <!-- cross edges top to bottom -->
    <line class="edge e5"  x1="148"  y1="55"  x2="220"  y2="175"/>
    <line class="edge e7"  x1="490"  y1="35"  x2="500"  y2="178"/>
    <line class="edge e9"  x1="840"  y1="52"  x2="800"  y2="180"/>
    <line class="edge e3"  x1="1070" y1="48"  x2="1080" y2="182"/>
  </g>

  <!-- Green active nodes -->
  <circle class="n-green n1"  cx="60"   cy="18"  r="2.2" fill="#22c55e"/>
  <circle class="n-green n2"  cx="265"  cy="28"  r="2.4" fill="#22c55e"/>
  <circle class="n-green n3"  cx="490"  cy="35"  r="2.0" fill="#22c55e"/>
  <circle class="n-green n4"  cx="720"  cy="30"  r="2.3" fill="#22c55e"/>
  <circle class="n-green n5"  cx="960"  cy="22"  r="2.1" fill="#22c55e"/>
  <circle class="n-green n6"  cx="1160" cy="20"  r="2.2" fill="#22c55e"/>
  <circle class="n-green n7"  cx="220"  cy="175" r="2.0" fill="#22c55e"/>
  <circle class="n-green n8"  cx="650"  cy="192" r="2.3" fill="#22c55e"/>
  <circle class="n-green n9"  cx="1080" cy="182" r="2.1" fill="#22c55e"/>

  <!-- Gray passive nodes -->
  <circle class="n-gray n10" cx="148"  cy="55"  r="1.8" fill="#94a3b8"/>
  <circle class="n-gray n11" cx="380"  cy="62"  r="1.6" fill="#94a3b8"/>
  <circle class="n-gray n12" cx="600"  cy="58"  r="1.9" fill="#94a3b8"/>
  <circle class="n-gray n13" cx="840"  cy="52"  r="1.7" fill="#94a3b8"/>
  <circle class="n-gray n14" cx="1070" cy="48"  r="1.8" fill="#94a3b8"/>
  <circle class="n-gray n15" cx="360"  cy="195" r="1.6" fill="#94a3b8"/>
  <circle class="n-gray n10" cx="500"  cy="178" r="1.7" fill="#94a3b8"/>
  <circle class="n-gray n11" cx="800"  cy="180" r="1.8" fill="#94a3b8"/>
  <circle class="n-gray n12" cx="940"  cy="196" r="1.6" fill="#94a3b8"/>
  <circle class="n-gray n13" cx="100"  cy="190" r="1.7" fill="#94a3b8"/>
  <circle class="n-gray n14" cx="1170" cy="198" r="1.6" fill="#94a3b8"/>

  <!-- Title text -->
  <g class="fadein">
    <text x="60" y="118" class="title" font-size="78">Problem Solving</text>
    <text x="60" y="196" class="title" font-size="78">Control Room
      <tspan class="cursor" fill="#22c55e">|</tspan>
    </text>
  </g>
</svg>
