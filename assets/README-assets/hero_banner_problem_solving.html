<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080c14;
    width: 100%;
    overflow: hidden;
  }

  .banner {
    position: relative;
    width: 100%;
    height: 220px;
    background: #080c14;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .text-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    animation: fadeIn 1.2s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .line {
    display: flex;
    align-items: center;
    font-family: 'Inter', 'Arial Black', sans-serif;
    font-weight: 900;
    color: #f0f6ff;
    letter-spacing: -2px;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
  }

  .line1 { font-size: clamp(36px, 6.5vw, 64px); }
  .line2 { font-size: clamp(36px, 6.5vw, 64px); margin-top: 2px; }

  .cursor {
    display: inline-block;
    width: clamp(4px, 0.7vw, 7px);
    height: clamp(30px, 5.5vw, 56px);
    background: #22c55e;
    margin-left: 6px;
    animation: blink 1.1s step-end infinite;
    vertical-align: middle;
    border-radius: 1px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>
<div class="banner">
  <canvas id="c"></canvas>
  <div class="text-wrap">
    <div class="line line1">Problem Solving</div>
    <div class="line line2">Control Room<span class="cursor"></span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();

const W = () => canvas.width;
const H = () => canvas.height;

const cols = 14, rows = 6;
let nodes = [];

function buildNodes() {
  nodes = [];
  const xStep = W() / (cols - 1);
  const yStep = H() / (rows - 1);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      nodes.push({
        x: c * xStep + (Math.random() - 0.5) * 18,
        y: r * yStep + (Math.random() - 0.5) * 18,
        ox: c * xStep,
        oy: r * yStep,
        pulse: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.6,
        r: 1.2 + Math.random() * 1.4,
        active: Math.random() > 0.55
      });
    }
  }
}
buildNodes();

function getEdges() {
  const edges = [];
  const threshold = W() / (cols - 1) * 1.6;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < threshold) edges.push([i, j, dist / threshold]);
    }
  }
  return edges;
}

function draw() {
  ctx.clearRect(0, 0, W(), H());

  nodes.forEach(n => {
    n.pulse += 0.008 * n.speed;
    n.x = n.ox + Math.sin(n.pulse) * 6;
    n.y = n.oy + Math.cos(n.pulse * 0.7) * 4;
  });

  const edges = getEdges();

  edges.forEach(([i, j, frac]) => {
    const a = nodes[i], b = nodes[j];
    const alpha = (1 - frac) * 0.13;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(148,163,184,${alpha})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  });

  nodes.forEach(n => {
    const glow = (Math.sin(n.pulse * 2) + 1) / 2;
    if (n.active) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 1.8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(34,197,94,${0.06 + glow * 0.10})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(34,197,94,${0.5 + glow * 0.4})`;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 0.8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(148,163,184,${0.15 + glow * 0.1})`;
      ctx.fill();
    }
  });

  requestAnimationFrame(draw);
}

draw();

window.addEventListener('resize', () => { resize(); buildNodes(); });
</script>
</body>
</html>
